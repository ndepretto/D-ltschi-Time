","unit":"8px"},"fontFamily":{"headline-md":["Work Sans"],"headline-lg-mobile":["Work Sans"],"body-md":["Work Sans"],"body-lg":["Work Sans"],"headline-lg":["Work Sans"],"label-caps":["Work Sans"]},"fontSize":{"headline-md":["24px",{"lineHeight":"32px","fontWeight":"600"}],"headline-lg-mobile":["32px",{"lineHeight":"38px","fontWeight":"700"}],"body-md":["16px",{"lineHeight":"24px","fontWeight":"400"}],"body-lg":["18px",{"lineHeight":"28px","fontWeight":"400"}],"headline-lg":["40px",{"lineHeight":"48px","letterSpacing":"-0.02em","fontWeight":"700"}],"label-caps":["12px",{"lineHeight":"16px","letterSpacing":"0.05em","fontWeight":"700"}]}}}};</script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@100..900&amp;display=swap" rel="stylesheet"/></head><body class="bg-surface font-body-md text-on-surface">
<!-- Password Overlay Modal -->
<div class="fixed inset-0 bg-on-surface/50 backdrop-blur-md z-[100] flex items-center justify-center" id="password-modal">
<div class="bg-surface-container-low p-8 rounded-xl shadow-xl w-full max-w-md mx-4">
<div class="flex items-center gap-3 mb-4 text-primary">
<span class="material-symbols-outlined text-[32px]">lock</span>
<h2 class="text-headline-md text-on-surface">Geschützter Bereich</h2>
</div>
<p class="text-body-md text-on-surface-variant mb-6">Bitte geben Sie das Passwort ein, um fortzufahren ("Willma").</p>
<form class="flex flex-col gap-4" id="form-password">
<div>
<input class="w-full bg-surface border-0 p-3.5 rounded-xl text-on-surface focus:ring-2 focus:ring-primary outline-none" id="input-password" placeholder="Passwort eingeben..." required="" type="password"/>
</div>
<button class="w-full bg-primary text-on-primary py-3.5 rounded-xl font-bold hover:opacity-90 transition-all" type="submit">Entsperren</button>
</form>
</div>
</div>
<aside class="fixed left-0 top-0 h-full w-64 bg-surface-container-low z-50 flex flex-col pt-6 pb-8"><div class="px-8 mb-10 text-xl font-headline-md text-primary flex items-center justify-between"><span>Döltschi Time</span><button class="text-error hover:opacity-80 p-1 rounded-lg" onclick="resetAllData()" title="Alle Daten zurücksetzen"><span class="material-symbols-outlined text-[20px]">delete_sweep</span></button></div><nav class="flex-1 px-4 space-y-1" data-active-classes="bg-primary-container text-on-primary-container font-bold rounded-xl"><a aria-current="page" class="flex items-center px-4 py-3 transition-all bg-primary-container text-on-primary-container font-bold rounded-xl" data-path="dashboard" href="#"><span class="material-symbols-outlined mr-3">dashboard</span>Dashboard</a><a class="flex items-center px-4 py-3 rounded-xl text-on-surface-variant hover:bg-surface-container-high hover:text-on-surface transition-all" data-path="mitarbeiter" href="#"><span class="material-symbols-outlined mr-3">group</span>Mitarbeiter</a><a class="flex items-center px-4 py-3 rounded-xl text-on-surface-variant hover:bg-surface-container-high hover:text-on-surface transition-all" data-path="zeiterfassung" href="#"><span class="material-symbols-outlined mr-3">schedule</span>Zeiterfassung</a><a class="flex items-center px-4 py-3 rounded-xl text-on-surface-variant hover:bg-surface-container-high hover:text-on-surface transition-all" data-path="wochenuebersicht" href="#"><span class="material-symbols-outlined mr-3">date_range</span>Wochenübersicht</a><a class="flex items-center px-4 py-3 rounded-xl text-on-surface-variant hover:bg-surface-container-high hover:text-on-surface transition-all" data-path="berichte" href="#"><span class="material-symbols-outlined mr-3">bar_chart</span>Berichte</a></nav></aside><div class="pl-64"><header class="fixed top-0 left-64 right-0 h-16 bg-surface/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)] z-40 flex items-center justify-between px-8"><div class="text-body-lg font-headline-md text-on-surface">Zeitmanagement</div><div class="flex items-center gap-4"><button class="text-xs bg-error-container text-on-error-container px-3 py-1.5 rounded-lg font-bold flex items-center gap-1 hover:opacity-80 transition-all" onclick="resetAllData()"><span class="material-symbols-outlined text-[16px]">restart_alt</span> Reset</button><span class="material-symbols-outlined text-on-surface-variant cursor-pointer hover:text-on-surface">notifications</span><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></header><main class="relative pt-16 bg-surface min-h-screen"><div class="flex flex-col w-full max-w-[800px] mx-auto px-6 py-8">
<!-- View Container -->
<div class="w-full" id="app-view">
<!-- Dynamically rendered views will appear here -->
</div>
</div>
<script>
  // Password Protection check
  document.getElementById('form-password').addEventListener('submit', (e) => {
    e.preventDefault();
    const val = document.getElementById('input-password').value;
    if (val === 'Willma') {
      document.getElementById('password-modal').style.display = 'none';
      localStorage.setItem('doeltschi_unlocked', 'true');
    } else {
      alert('Falsches Passwort! (Tipp: Willma)');
    }
  });

  if (localStorage.getItem('doeltschi_unlocked') === 'true') {
    document.getElementById('password-modal').style.display = 'none';
  }

  // Initial Data
  const defaultEmployees = [
    { id: 1, name: 'Nicole De Pretto', title: 'Senior Project Manager', pensum: 100, targetHours: 1800, currentHours: 1420 },
    { id: 2, name: 'Michelle Infanger', title: 'UI/UX Designer', pensum: 80, targetHours: 1440, currentHours: 1100 },
    { id: 3, name: 'Manuel Schoch', title: 'Lead Developer', pensum: 100, targetHours: 1800, currentHours: 1650 },
    { id: 4, name: 'Seline Steinmann', title: 'HR & Operations', pensum: 60, targetHours: 1080, currentHours: 720 }
  ];

  const defaultEntries = [
    { id: 1, date: '2023-10-24', employeeId: 1, morningFrom: '08:00', morningTo: '12:00', afternoonFrom: '13:00', afternoonTo: '17:00', type: 'Regulär', notes: 'Projektkickoff' },
    { id: 2, date: '2023-10-24', employeeId: 2, morningFrom: '08:30', morningTo: '12:00', afternoonFrom: '13:00', afternoonTo: '16:30', type: 'Regulär', notes: 'Designsystem' },
    { id: 3, date: '2023-10-25', employeeId: 3, morningFrom: '09:00', morningTo: '12:30', afternoonFrom: '13:30', afternoonTo: '18:00', type: 'Regulär', notes: 'Backend Architektur' }
  ];

  // State Management
  let employees = JSON.parse(localStorage.getItem('doeltschi_employees')) || defaultEmployees;
  let timeEntries = JSON.parse(localStorage.getItem('doeltschi_entries')) || defaultEntries;
  let currentPath = 'dashboard';
  let editingEntryId = null;

  function saveState() {
    localStorage.setItem('doeltschi_employees', JSON.stringify(employees));
    localStorage.setItem('doeltschi_entries', JSON.stringify(timeEntries));
  }

  window.resetAllData = function() {
    if (confirm('Möchten Sie wirklich alle Daten zurücksetzen?')) {
      localStorage.removeItem('doeltschi_employees');
      localStorage.removeItem('doeltschi_entries');
      employees = JSON.parse(JSON.stringify(defaultEmployees));
      timeEntries = JSON.parse(JSON.stringify(defaultEntries));
      renderView();
      alert('Alle Daten wurden auf den Standard zurückgesetzt.');
    }
  }

  // Navigation wiring
  document.querySelectorAll('aside nav a').forEach(link => {
    link.addEventListener('click', (e) => {
      e.preventDefault();
      const path = link.getAttribute('data-path');
      navigateTo(path);
    });
  });

  function navigateTo(path) {
    currentPath = path;
    
    // Update sidebar active classes
    document.querySelectorAll('aside nav a').forEach(a => {
      const activeClasses = document.querySelector('aside nav').getAttribute('data-active-classes').split(' ');
      if (a.getAttribute('data-path') === path) {
        a.classList.add(...activeClasses);
        a.classList.remove('text-on-surface-variant', 'hover:bg-surface-container-high', 'hover:text-on-surface');
      } else {
        a.classList.remove(...activeClasses);
        a.classList.add('text-on-surface-variant', 'hover:bg-surface-container-high', 'hover:text-on-surface');
      }
    });

    renderView();
  }

  function renderView() {
    const container = document.getElementById('app-view');
    if (!container) return;

    switch(currentPath) {
      case 'dashboard':
        container.innerHTML = renderDashboard();
        break;
      case 'mitarbeiter':
        container.innerHTML = renderMitarbeiter();
        setupMitarbeiterListeners();
        break;
      case 'zeiterfassung':
        container.innerHTML = renderZeiterfassung();
        setupZeiterfassungListeners();
        break;
      case 'wochenuebersicht':
        container.innerHTML = renderWochenuebersicht();
        break;
      case 'berichte':
        container.innerHTML = renderBerichte();
        setupBerichteListeners();
        break;
      default:
        container.innerHTML = renderDashboard();
    }
  }

  // Views Implementation

  function renderDashboard() {
    const totalHoursAll = employees.reduce((acc, curr) => acc + curr.currentHours, 0);
    const totalTargetAll = employees.reduce((acc, curr) => acc + curr.targetHours, 0);
    const overallProgress = Math.round((totalHoursAll / totalTargetAll) * 100);

    return `
      <div class="flex flex-col gap-stack-lg">
        <!-- Top Banner -->
        <div class="bg-primary-container text-on-primary-container p-8 rounded-xl relative overflow-hidden shadow-sm flex flex-col justify-between">
          <div class="relative z-10">
            <span class="text-label-caps bg-primary text-on-primary px-3 py-1 rounded-full uppercase tracking-wider">Übersicht 2023</span>
            <h1 class="text-headline-lg mt-4 text-on-primary-container">Team Döltschi Time</h1>
            <p class="text-body-lg mt-2 opacity-90 max-w-[500px]">Alle Arbeitszeiten und Pensen im Blick. Aktuelle Gesamtauslastung liegt bei ${overallProgress}%.</p>
          </div>
          <div class="absolute right-[-20px] bottom-[-20px] opacity-10 pointer-events-none">
            <span class="material-symbols-outlined text-[180px]">schedule</span>
          </div>
        </div>

        <!-- Metrics Grid -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
          <div class="bg-surface-container-low p-6 rounded-xl shadow-sm flex flex-col justify-between">
            <div class="flex items-center justify-between text-on-surface-variant">
              <span class="text-label-caps">Mitarbeiter Total</span>
              <span class="material-symbols-outlined text-primary">group</span>
            </div>
            <div class="text-headline-lg mt-4">${employees.length}</div>
            <div class="text-body-md text-on-surface-variant mt-1">Aktiv im System</div>
          </div>
          <div class="bg-surface-container-low p-6 rounded-xl shadow-sm flex flex-col justify-between">
            <div class="flex items-center justify-between text-on-surface-variant">
              <span class="text-label-caps">Erfasste Stunden</span>
              <span class="material-symbols-outlined text-primary">trending_up</span>
            </div>
            <div class="text-headline-lg mt-4">${totalHoursAll}h</div>
            <div class="text-body-md text-on-surface-variant mt-1">Von ${totalTargetAll}h Soll</div>
          </div>
          <div class="bg-surface-container-low p-6 rounded-xl shadow-sm flex flex-col justify-between">
            <div class="flex items-center justify-between text-on-surface-variant">
              <span class="text-label-caps">Einträge diesen Monat</span>
              <span class="material-symbols-outlined text-primary">event_note</span>
            </div>
            <div class="text-headline-lg mt-4">${timeEntries.length}</div>
            <div class="text-body-md text-on-surface-variant mt-1">Lokal gespeichert</div>
          </div>
        </div>

        <!-- Progress Bars Section -->
        <div class="bg-surface-container-low p-8 rounded-xl shadow-sm">
          <h2 class="text-headline-md mb-6 text-on-surface">Jahresarbeitszeit-Fortschritt</h2>
          <div class="flex flex-col gap-6">
            ${employees.map(emp => {
              const pct = Math.min(100, Math.round((emp.currentHours / emp.targetHours) * 100));
              return `
                <div class="flex flex-col gap-2">
                  <div class="flex justify-between items-center">
                    <div>
                      <span class="font-bold text-on-surface">${emp.name}</span>
                      <span class="text-on-surface-variant text-sm ml-2">(${emp.title} • ${emp.pensum}%)</span>
                    </div>
                    <span class="text-on-surface font-headline-md">${emp.currentHours}h / ${emp.targetHours}h (${pct}%)</span>
                  </div>
                  <div class="w-full bg-surface-container-highest h-3 rounded-full overflow-hidden">
                    <div class="bg-primary h-full rounded-full transition-all duration-500" style="width: ${pct}%"></div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      </div>
    `;
  }

  function renderMitarbeiter() {
    return `
      <div class="flex flex-col gap-stack-lg">
        <div class="flex justify-between items-center">
          <div>
            <h1 class="text-headline-lg text-on-surface">Mitarbeiter-Verwaltung</h1>
            <p class="text-body-md text-on-surface-variant mt-1">Fügen Sie neue Teammitglieder hinzu oder bearbeiten Sie bestehende Pensen.</p>
          </div>
          <button id="btn-toggle-add" class="bg-primary text-on-primary px-5 py-3 rounded-xl font-bold flex items-center gap-2 shadow-sm hover:opacity-90 transition-all">
            <span class="material-symbols-outlined">person_add</span> Neuer Mitarbeiter
          </button>
        </div>

        <!-- Add Employee Form Modal/Card (Hidden by default or toggled) -->
        <div id="add-employee-card" class="hidden bg-surface-container-low p-6 rounded-xl shadow-sm">
          <h3 class="text-headline-md mb-4 text-on-surface">Mitarbeiter erfassen</h3>
          <form id="form-add-employee" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-label-caps text-on-surface-variant mb-1">Vollständiger Name</label>
              <input type="text" id="emp-name" required class="w-full bg-surface border-0 p-3 rounded-xl text-on-surface focus:ring-2 focus:ring-primary outline-none" placeholder="z.B. Anna Meier">
            </div>
            <div>
              <label class="block text-label-caps text-on-surface-variant mb-1">Berufsbezeichnung / Titel</label>
              <input type="text" id="emp-title" required class="w-full bg-surface border-0 p-3 rounded-xl text-on-surface focus:ring-2 focus:ring-primary outline-none" placeholder="z.B. Frontend Developer">
            </div>
            <div>
              <label class="block text-label-caps text-on-surface-variant mb-1">Pensum (%)</label>
              <input type="number" id="emp-pensum" value="100" min="10" max="100" required class="w-full bg-surface border-0 p-3 rounded-xl text-on-surface focus:ring-2 focus:ring-primary outline-none">
            </div>
            <div>
              <label class="block text-label-caps text-on-surface-variant mb-1">Jahressoll (Stunden)</label>
              <input type="number" id="emp-target" value="1800" required class="w-full bg-surface border-0 p-3 rounded-xl text-on-surface focus:ring-2 focus:ring-primary outline-none">
            </div>
            <div class="md:col-span-2 flex justify-end gap-3 mt-2">
              <button type="button" id="btn-cancel-add" class="px-5 py-2.5 rounded-xl bg-surface-container-high text-on-surface font-bold">Abbrechen</button>
              <button type="submit" class="px-5 py-2.5 rounded-xl bg-primary text-on-primary font-bold">Speichern</button>
            </div>
          </form>
        </div>

        <!-- List -->
        <div class="grid grid-cols-1 gap-4">
          ${employees.map(emp => `
            <div class="bg-surface-container-low p-6 rounded-xl shadow-sm flex items-center justify-between">
              <div class="flex items-center gap-4">
                <div class="w-12 h-12 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center font-bold text-lg">
                  ${emp.name.split(' ').map(n => n[0]).join('')}
                </div>
                <div>
                  <h4 class="font-bold text-lg text-on-surface">${emp.name}</h4>
                  <p class="text-on-surface-variant text-sm">${emp.title} • Pensum: ${emp.pensum}% • Soll: ${emp.targetHours}h</p>
                </div>
              </div>
              <div class="flex items-center gap-2">
                <button onclick="resetEmployeeHours(${emp.id})" title="Arbeitszeiten zurücksetzen" class="p-2.5 rounded-xl bg-surface-container-high text-on-surface hover:bg-surface-container-highest transition-all">
                  <span class="material-symbols-outlined text-[20px]">restart_alt</span>
                </button>
                <button onclick="deleteEmployee(${emp.id})" title="Löschen" class="p-2.5 rounded-xl bg-error-container text-on-error-container hover:opacity-80 transition-all">
                  <span class="material-symbols-outlined text-[20px]">delete</span>
                </button>
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }

  function setupMitarbeiterListeners() {
    const btnToggle = document.getElementById('btn-toggle-add');
    const cardAdd = document.getElementById('add-employee-card');
    const btnCancel = document.getElementById('btn-cancel-add');
    const formAdd = document.getElementById('form-add-employee');

    if (btnToggle && cardAdd) {
      btnToggle.addEventListener('click', () => {
        cardAdd.classList.toggle('hidden');
      });
    }

    if (btnCancel && cardAdd) {
      btnCancel.addEventListener('click', () => {
        cardAdd.classList.add('hidden');
      });
    }

    if (formAdd) {
      formAdd.addEventListener('submit', (e) => {
        e.preventDefault();
        const newEmp = {
          id: Date.now(),
          name: document.getElementById('emp-name').value,
          title: document.getElementById('emp-title').value,
          pensum: parseInt(document.getElementById('emp-pensum').value),
          targetHours: parseInt(document.getElementById('emp-target').value),
          currentHours: 0
        };
        employees.push(newEmp);
        saveState();
        renderView();
      });
    }
  }

  window.deleteEmployee = function(id) {
    employees = employees.filter(e => e.id !== id);
    saveState();
    renderView();
  }

  window.resetEmployeeHours = function(id) {
    const emp = employees.find(e => e.id === id);
    if(emp) {
      emp.currentHours = 0;
      saveState();
      renderView();
    }
  }

  function renderZeiterfassung() {
    const todayStr = new Date().toISOString().split('T')[0];
    let editEntry = timeEntries.find(e => e.id === editingEntryId) || {};

    return `
      <div class="flex flex-col gap-stack-lg">
        <div>
          <h1 class="text-headline-lg text-on-surface">Tageserfassung</h1>
          <p class="text-body-md text-on-surface-variant mt-1">Arbeitszeiten, Pausen und Abwesenheiten tagesgenau erfassen.</p>
        </div>

        <div class="bg-surface-container-low p-8 rounded-xl shadow-sm">
          <form id="form-time-entry" class="flex flex-col gap-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              <div>
                <label class="block text-label-caps text-on-surface-variant mb-2">Mitarbeiter</label>
                <select id="entry-employee" required class="w-full bg-surface border-0 p-3 rounded-xl text-on-surface focus:ring-2 focus:ring-primary outline-none">
                  ${employees.map(e => `<option value="${e.id}" ${editEntry.employeeId == e.id ? 'selected' : ''}>${e.name} (${e.title})</option>`).join('')}
                </select>
              </div>
              <div>
                <label class="block text-label-caps text-on-surface-variant mb-2">Datum</label>
                <input type="date" id="entry-date" value="${editEntry.date || todayStr}" required class="w-full bg-surface border-0 p-3 rounded-xl text-on-surface focus:ring-2 focus:ring-primary outline-none">
              </div>
            </div>

            <!-- Vormittag / Nachmittag -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 pt-4 border-t border-surface-container-highest">
              <div class="flex flex-col gap-3">
                <span class="text-label-caps text-on-surface-variant">Vormittag</span>
                <div class="grid grid-cols-2 gap-3">
                  <div>
                    <label class="block text-xs text-on-surface-variant mb-1">Von</label>
                    <input type="time" id="entry-m-from" value="${editEntry.morningFrom || '08:00'}" class="w-full bg-surface border-0 p-3 rounded-xl text-on-surface focus:ring-2 focus:ring-primary outline-none">
                  </div>
                  <div>
                    <label class="block text-xs text-on-surface-variant mb-1">Bis</label>
                    <input type="time" id="entry-m-to" value="${editEntry.morningTo || '12:00'}" class="w-full bg-surface border-0 p-3 rounded-xl text-on-surface focus:ring-2 focus:ring-primary outline-none">
                  </div>
                </div>
              </div>

              <div class="flex flex-col gap-3">
                <span class="text-label-caps text-on-surface-variant">Nachmittag</span>
                <div class="grid grid-cols-2 gap-3">
                  <div>
                    <label class="block text-xs text-on-surface-variant mb-1">Von</label>
                    <input type="time" id="entry-a-from" value="${editEntry.afternoonFrom || '13:00'}" class="w-full bg-surface border-0 p-3 rounded-xl text-on-surface focus:ring-2 focus:ring-primary outline-none">
                  </div>
                  <div>
                    <label class="block text-xs text-on-surface-variant mb-1">Bis</label>
                    <input type="time" id="entry-a-to" value="${editEntry.afternoonTo || '17:00'}" class="w-full bg-surface border-0 p-3 rounded-xl text-on-surface focus:ring-2 focus:ring-primary outline-none">
                  </div>
                </div>
              </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 pt-4 border-t border-surface-container-highest">
              <div>
                <label class="block text-label-caps text-on-surface-variant mb-2">Abwesenheit / Status</label>
                <select id="entry-type" class="w-full bg-surface border-0 p-3 rounded-xl text-on-surface focus:ring-2 focus:ring-primary outline-none">
                  <option value="Regulär" ${editEntry.type === 'Regulär' ? 'selected' : ''}>Regulär Arbeit</option>
                  <option value="Krankheit" ${editEntry.type === 'Krankheit' ? 'selected' : ''}>Krankheit</option>
                  <option value="Ferien" ${editEntry.type === 'Ferien' ? 'selected' : ''}>Ferien</option>
                  <option value="Unfall" ${editEntry.type === 'Unfall' ? 'selected' : ''}>Unfall / Sonstiges</option>
                </select>
              </div>
              <div>
                <label class="block text-label-caps text-on-surface-variant mb-2">Notizen</label>
                <input type="text" id="entry-notes" value="${editEntry.notes || ''}" placeholder="z.B. Kundentermin Zürich" class="w-full bg-surface border-0 p-3 rounded-xl text-on-surface focus:ring-2 focus:ring-primary outline-none">
              </div>
            </div>

            <div class="flex justify-end gap-3 pt-4">
              ${editingEntryId ? `<button type="button" onclick="cancelEditEntry()" class="px-5 py-3.5 rounded-xl bg-surface-container-high text-on-surface font-bold">Abbrechen</button>` : ''}
              <button type="submit" class="bg-primary text-on-primary px-8 py-3.5 rounded-xl font-bold flex items-center gap-2 shadow-sm hover:opacity-90 transition-all">
                <span class="material-symbols-outlined">save</span> ${editingEntryId ? 'Eintrag aktualisieren' : 'Zeiteintrag speichern'}
              </button>
            </div>
          </form>
        </div>

        <!-- Recent Entries Log -->
        <div class="bg-surface-container-low p-8 rounded-xl shadow-sm">
          <h3 class="text-headline-md mb-4 text-on-surface">Kürzliche Einträge</h3>
          <div class="flex flex-col gap-3">
            ${timeEntries.slice(-10).reverse().map(entry => {
              const emp = employees.find(e => e.id == entry.employeeId) || { name: 'Unbekannt' };
              return `
                <div class="flex items-center justify-between p-4 rounded-xl bg-surface">
                  <div class="flex items-center gap-4">
                    <span class="material-symbols-outlined text-primary">schedule</span>
                    <div>
                      <div class="font-bold text-on-surface">${emp.name} <span class="text-xs font-normal text-on-surface-variant ml-2">${entry.date}</span></div>
                      <div class="text-sm text-on-surface-variant">${entry.type} • ${entry.morningFrom}-${entry.morningTo} / ${entry.afternoonFrom}-${entry.afternoonTo} ${entry.notes ? '• ' + entry.notes : ''}</div>
                    </div>
                  </div>
                  <div class="flex items-center gap-2">
                    <button onclick="editEntry(${entry.id})" class="text-on-surface-variant p-2 hover:bg-surface-container-high rounded-lg transition-all" title="Bearbeiten">
                      <span class="material-symbols-outlined text-[18px]">edit</span>
                    </button>
                    <button onclick="deleteEntry(${entry.id})" class="text-error p-2 hover:bg-error-container rounded-lg transition-all" title="Löschen">
                      <span class="material-symbols-outlined text-[18px]">delete</span>
                    </button>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      </div>
    `;
  }

  function setupZeiterfassungListeners() {
    const form = document.getElementById('form-time-entry');
    if (form) {
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const empId = parseInt(document.getElementById('entry-employee').value);
        const mFrom = document.getElementById('entry-m-from').value;
        const mTo = document.getElementById('entry-m-to').value;
        const aFrom = document.getElementById('entry-a-from').value;
        const aTo = document.getElementById('entry-a-to').value;

        const getHoursDiff = (f, t) => {
          if (!f || !t) return 0;
          const [fh, fm] = f.split(':').map(Number);
          const [th, tm] = t.split(':').map(Number);
          return Math.max(0, ((th + tm/60) - (fh + fm/60)));
        };

        const totalHours = Math.round(getHoursDiff(mFrom, mTo) + getHoursDiff(aFrom, aTo));

        if (editingEntryId) {
          const idx = timeEntries.findIndex(e => e.id === editingEntryId);
          if (idx !== -1) {
            timeEntries[idx] = {
              id: editingEntryId,
              employeeId: empId,
              date: document.getElementById('entry-date').value,
              morningFrom: mFrom,
              morningTo: mTo,
              afternoonFrom: aFrom,
              afternoonTo: aTo,
              type: document.getElementById('entry-type').value,
              notes: document.getElementById('entry-notes').value
            };
          }
          editingEntryId = null;
        } else {
          const newEntry = {
            id: Date.now(),
            employeeId: empId,
            date: document.getElementById('entry-date').value,
            morningFrom: mFrom,
            morningTo: mTo,
            afternoonFrom: aFrom,
            afternoonTo: aTo,
            type: document.getElementById('entry-type').value,
            notes: document.getElementById('entry-notes').value
          };
          timeEntries.push(newEntry);
          const emp = employees.find(e => e.id === empId);
          if (emp) {
            emp.currentHours += totalHours;
          }
        }

        saveState();
        renderView();
        alert('Zeiterfassung erfolgreich gespeichert!');
      });
    }
  }

  window.editEntry = function(id) {
    editingEntryId = id;
    renderView();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  window.cancelEditEntry = function() {
    editingEntryId = null;
    renderView();
  }

  window.deleteEntry = function(id) {
    if(confirm('Möchten Sie diesen Eintrag wirklich löschen?')) {
      timeEntries = timeEntries.filter(e => e.id !== id);
      saveState();
      renderView();
    }
  }

  function renderWochenuebersicht() {
    const days = ['Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag', 'Sonntag'];
    return `
      <div class="flex flex-col gap-stack-lg">
        <div>
          <h1 class="text-headline-lg text-on-surface">Wochenübersicht</h1>
          <p class="text-body-md text-on-surface-variant mt-1">Interaktives 7-Tage-Grid mit Stunden-Totals pro Tag und Mitarbeiter.</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-7 gap-3">
          ${days.map((day, idx) => `
            <div class="bg-surface-container-low p-4 rounded-xl flex flex-col gap-3 shadow-sm">
              <div class="text-label-caps text-primary border-b border-surface-container-highest pb-2">${day}</div>
              <div class="flex flex-col gap-2 min-h-[140px]">
                ${timeEntries.filter(e => new Date(e.date).getDay() === ((idx + 1) % 7)).map(entry => {
                  const emp = employees.find(em => em.id == entry.employeeId) || {};
                  return `
                    <div class="bg-surface p-2.5 rounded-lg text-xs shadow-sm flex items-center justify-between">
                      <div>
                        <div class="font-bold text-on-surface truncate">${emp.name || 'Team'}</div>
                        <div class="text-on-surface-variant">${entry.type}</div>
                      </div>
                      <button onclick="deleteEntry(${entry.id})" class="text-error hover:opacity-80"><span class="material-symbols-outlined text-[14px]">close</span></button>
                    </div>
                  `;
                }).join('') || '<span class="text-xs text-on-surface-variant italic mt-4 text-center">Keine Einträge</span>'}
              </div>
              <div class="mt-auto pt-2 border-t border-surface-container-highest text-right text-xs font-bold text-on-surface">
                Total: 8h
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }

  function renderBerichte() {
    return `
      <div class="flex flex-col gap-stack-lg">
        <div>
          <h1 class="text-headline-lg text-on-surface">Monatsberichte & Salden</h1>
          <p class="text-body-md text-on-surface-variant mt-1">Detaillierte Auswertungen und Exportmöglichkeiten für die Lohnbuchhaltung.</p>
        </div>

        <div class="bg-surface-container-low p-8 rounded-xl shadow-sm flex flex-col gap-6">
          <h3 class="text-headline-md text-on-surface">Export-Optionen</h3>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-surface p-6 rounded-xl flex items-center justify-between shadow-sm">
              <div class="flex items-center gap-4">
                <span class="material-symbols-outlined text-[36px] text-primary">description</span>
                <div>
                  <h4 class="font-bold text-on-surface">Excel Export (CSV)</h4>
                  <p class="text-sm text-on-surface-variant">Alle erfassten Stunden im Tabellenformat</p>
                </div>
              </div>
              <button onclick="alert('Excel-Export erfolgreich generiert (Lokaler Download).')" class="bg-primary text-on-primary px-4 py-2 rounded-xl text-sm font-bold">Export</button>
            </div>
            <div class="bg-surface p-6 rounded-xl flex items-center justify-between shadow-sm">
              <div class="flex items-center gap-4">
                <span class="material-symbols-outlined text-[36px] text-primary">picture_as_pdf</span>
                <div>
                  <h4 class="font-bold text-on-surface">PDF Monatsbericht</h4>
                  <p class="text-sm text-on-surface-variant">Komplette Saldenübersicht mit Unterschriftenfeld</p>
                </div>
              </div>
              <button onclick="alert('PDF-Bericht erfolgreich generiert (Lokaler Download).')" class="bg-primary text-on-primary px-4 py-2 rounded-xl text-sm font-bold">Export</button>
            </div>
          </div>
        </div>

        <div class="bg-surface-container-low p-8 rounded-xl shadow-sm">
          <h3 class="text-headline-md mb-6 text-on-surface">Saldo-Zusammenfassung nach Mitarbeiter</h3>
          <div class="overflow-x-auto">
            <table class="w-full text-left text-body-md">
              <thead>
                <tr class="border-b border-surface-container-highest text-label-caps text-on-surface-variant">
                  <th class="pb-3">Mitarbeiter</th>
                  <th class="pb-3">Pensum</th>
                  <th class="pb-3">Soll (Std)</th>
                  <th class="pb-3">Ist (Std)</th>
                  <th class="pb-3">Saldo</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-surface-container-highest">
                ${employees.map(emp => {
                  const saldo = emp.currentHours - Math.round(emp.targetHours * 0.8);
                  return `
                    <tr>
                      <td class="py-4 font-bold text-on-surface">${emp.name}</td>
                      <td class="py-4 text-on-surface-variant">${emp.pensum}%</td>
                      <td class="py-4 text-on-surface-variant">${emp.targetHours}h</td>
                      <td class="py-4 text-on-surface-variant">${emp.currentHours}h</td>
                      <td class="py-4 font-bold ${saldo >= 0 ? 'text-primary' : 'text-error'}">${saldo >= 0 ? '+' : ''}${saldo}h</td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        </div>
      </div>
    `;
  }

  function setupBerichteListeners() {}

  // Initial load
  renderView();
</script></main></div></body></html>
