l <!DOCTYPE html> <html lang="de-CH"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Döltschi Time | Master System</title> <script src="https://cdn.tailwindcss.com"></script> <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"> <style> @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap'); body { font-family: 'Inter', sans-serif; } .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(4px); } .modal.active { display: flex; } .view { display: none; } .view.active { display: block; } </style> </head> <body class="bg-slate-50 min-h-screen text-slate-900"> <!-- Firebase SDKs --> <script type="module"> import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"; import { getFirestore, doc, setDoc, getDoc, onSnapshot, updateDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"; // --- FIREBASE KONFIGURATION --- const firebaseConfig = { apiKey: "AIzaSyDUcNbEBX9FUbRLnbFY99Iq877cVbZrCqQ", authDomain: "doeltschi-time.firebaseapp.com", projectId: "doeltschi-time", storageBucket: "doeltschi-time.appspot.com", messagingSenderId: "367375263641", appId: "1:367375263641:web:1270222f67605d8f760920" }; const app = initializeApp(firebaseConfig); const db = getFirestore(app); // State & Data let currentUser = null; let isAdmin = false; let employees = []; let timeEntries = []; const ADMIN_PW = "Willma"; // APP INITIALISIERUNG (Wartet auf Cloud-Daten) async function initApp() { console.log("Initialisiere Döltschi Time Master..."); // Mitarbeiter aus Cloud laden oder Defaults setzen const empSnap = await getDocs(collection(db, "employees")); if (empSnap.empty) { const defaults = [ { id: "1", name: "Nicole De Pretto", pensum: 100, role: "Geschäftsführung", targetHours: 2080 }, { id: "2", name: "Michelle Dreifuss", pensum: 100, role: "Leitung", targetHours: 2080 }, { id: "3", name: "Manuel Schoch", pensum: 80, role: "Mitarbeiter", targetHours: 1664 }, { id: "4", name: "Seline Steinmann", pensum: 92, role: "Mitarbeiter", targetHours: 1913 } ]; for (let e of defaults) { await setDoc(doc(db, "employees", e.id), e); } employees = defaults; } else { employees = empSnap.docs.map(d => d.data()); } // Realtime Sync für Zeitbuchungen onSnapshot(collection(db, "timeEntries"), (snapshot) => { timeEntries = snapshot.docs.map(d => d.data()); renderDashboard(); renderEntries(); }); renderEmployeeList(); showView('login-view'); } // NAVIGATION window.showView = (id) => { document.querySelectorAll('.view').forEach(v => v.classList.remove('active')); document.getElementById(id).classList.add('active'); if (id === 'dashboard-view') renderDashboard(); }; // LOGIN window.handleLogin = () => { const pw = document.getElementById('login-pw').value; if (pw === ADMIN_PW) { isAdmin = true; showView('dashboard-view'); } else { alert("Falsches Passwort!"); } }; // MODAL LOGIK window.openModal = (id) => document.getElementById(id).classList.add('active'); window.closeModal = (id) => document.getElementById(id).classList.remove('active'); // ZEITERFASSUNG SPEICHERN window.saveTime = async () => { const date = document.getElementById('entry-date').value; const empId = document.getElementById('entry-emp').value; const type = document.getElementById('entry-type').value; const start = document.getElementById('entry-start').value; const end = document.getElementById('entry-end').value; if (!date || !empId) return alert("Bitte alle Felder ausfüllen!"); // Modal SOFORT schliessen (User Experience) closeModal('time-modal'); const entry = { id: Date.now().toString(), date, empId, type, start, end, timestamp: new Date().toISOString() }; await setDoc(doc(db, "timeEntries", entry.id), entry); console.log("Zeit gespeichert"); }; // MITARBEITER SPEICHERN window.saveEmployee = async () => { const name = document.getElementById('emp-name').value; const role = document.getElementById('emp-role').value; const pensum = document.getElementById('emp-pensum').value; if (!name) return; closeModal('emp-modal'); const newEmp = { id: Date.now().toString(), name, role, pensum: parseFloat(pensum), targetHours: (2080 * (pensum/100)).toFixed(0) }; await setDoc(doc(db, "employees", newEmp.id), newEmp); employees.push(newEmp); renderEmployeeList(); }; // RENDERING function renderEmployeeList() { const list = document.getElementById('employee-list'); const select = document.getElementById('entry-emp'); if (!list) return; list.innerHTML = employees.map(e => ` <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex justify-between items-center"> <div> <p class="font-bold text-slate-800">${e.name}</p> <p class="text-xs text-slate-500">${e.role} (${e.pensum}%)</p> </div> <button class="text-slate-400 hover:text-red-500"><i class="material-icons">delete</i></button> </div> `).join(''); select.innerHTML = employees.map(e => `<option value="${e.id}">${e.name}</option>`).join(''); } function renderDashboard() { // Dashboard Logik für Stundenberechnung console.log("Dashboard aktualisiert"); } function renderEntries() { const container = document.getElementById('entries-table'); if (!container) return; container.innerHTML = timeEntries.sort((a,b) => b.date.localeCompare(a.date)).map(t => { const emp = employees.find(e => e.id === t.empId); return ` <tr class="border-b border-slate-100 text-sm"> <td class="py-3 px-4">${t.date}</td> <td class="py-3 px-4 font-medium">${emp ? emp.name : 'Unbekannt'}</td> <td class="py-3 px-4">${t.start || '-'} - ${t.end || '-'}</td> <td class="py-3 px-4"><span class="px-2 py-1 bg-blue-50 text-blue-600 rounded text-xs">${t.type}</span></td> </tr> `; }).join(''); } window.onload = initApp; </script> <!-- VIEWS --> <!-- Login View --> <div id="login-view" class="view flex items-center justify-center min-h-screen"> <div class="bg-white p-12 rounded-[2rem] shadow-2xl w-full max-w-md text-center border border-slate-100"> <div class="w-20 h-20 bg-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-8 shadow-lg"> <i class="material-icons text-white text-4xl">schedule</i> </div> <h1 class="text-4xl font-black text-slate-900 mb-2">Döltschi Time</h1> <p class="text-slate-400 mb-10 font-medium">Administrator Login</p> <input type="password" id="login-pw" placeholder="Passwort eingeben..." class="w-full bg-slate-50 border-2 border-slate-100 rounded-2xl px-6 py-4 mb-4 outline-none focus:border-blue-600 transition-all text-center font-bold"> <button onclick="handleLogin()" class="w-full bg-blue-600 text-white font-bold py-4 rounded-2xl hover:bg-blue-700 shadow-lg shadow-blue-200 transition-all">Anmelden</button> </div> </div> <!-- Main Dashboard View --> <div id="dashboard-view" class="view"> <header class="bg-white border-b border-slate-200 sticky top-0 z-50"> <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between"> <div class="flex items-center gap-3"> <div class="w-10 h-10 bg-blue-600 rounded-lg flex items-center justify-center"><i class="material-icons text-white">schedule</i></div> <span class="text-xl font-bold tracking-tight">Döltschi <span class="text-blue-600">Time</span></span> </div> <nav class="flex gap-4"> <button onclick="showView('dashboard-view')" class="px-4 py-2 text-blue-600 font-bold border-b-2 border-blue-600">Übersicht</button> <button onclick="showView('employee-view')" class="px-4 py-2 text-slate-500 font-medium hover:text-blue-600">Team</button> <button onclick="window.location.reload()" class="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center text-slate-600 hover:bg-red-50 hover:text-red-600 transition-all"><i class="material-icons">logout</i></button> </nav> </div> </header> <main class="max-w-7xl mx-auto px-6 py-12"> <div class="flex justify-between items-end mb-12"> <div> <h2 class="text-5xl font-black text-slate-900 tracking-tight">Dashboard</h2> <p class="text-slate-400 font-medium mt-2">Willkommen zurück in der Zeiterfassung.</p> </div> <button onclick="openModal('time-modal')" class="bg-blue-600 text-white px-8 py-4 rounded-2xl font-bold flex items-center gap-2 hover:bg-blue-700 shadow-lg shadow-blue-200 transition-all"> <i class="material-icons">add</i> Zeit erfassen </button> </div> <div class="bg-white rounded-[2rem] border border-slate-200 overflow-hidden shadow-sm"> <table class="w-full text-left border-collapse"> <thead class="bg-slate-50 text-slate-400 text-xs font-bold uppercase tracking-wider"> <tr> <th class="py-4 px-6">Datum</th> <th class="py-4 px-6">Mitarbeiter</th> <th class="py-4 px-6">Zeitraum</th> <th class="py-4 px-6">Typ</th> </tr> </thead> <tbody id="entries-table"> <!-- Einträge kommen aus JS --> </tbody> </table> </div> </main> </div> <!-- Team/Employee View --> <div id="employee-view" class="view"> <!-- Ähnlich aufgebaut wie Dashboard, zeigt Employee List --> <header class="bg-white border-b border-slate-200"> <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between"> <div class="flex items-center gap-3"> <span class="text-xl font-bold tracking-tight">Döltschi <span class="text-blue-600">Time</span></span> </div> <nav class="flex gap-4"> <button onclick="showView('dashboard-view')" class="px-4 py-2 text-slate-500 font-medium">Übersicht</button> <button onclick="showView('employee-view')" class="px-4 py-2 text-blue-600 font-bold border-b-2 border-blue-600">Team</button> </nav> </div> </header> <main class="max-w-7xl mx-auto px-6 py-12"> <div class="flex justify-between items-center mb-8"> <h2 class="text-4xl font-black">Team Verwaltung</h2> <button onclick="openModal('emp-modal')" class="bg-blue-600 text-white px-6 py-3 rounded-xl font-bold">+ Mitarbeiter</button> </div> <div id="employee-list" class="grid md:grid-cols-2 lg:grid-cols-3 gap-6"> <!-- JS Injektion --> </div> </main> </div> <!-- MODALS --> <!-- Zeiterfassung Modal --> <div id="time-modal" class="modal"> <div class="bg-white p-10 rounded-3xl w-full max-w-lg shadow-2xl"> <h3 class="text-2xl font-bold mb-6">Zeit buchen</h3> <div class="space-y-4"> <input type="date" id="entry-date" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-xl outline-none"> <select id="entry-emp" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-xl outline-none"> <!-- Aus JS --> </select> <select id="entry-type" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-xl outline-none"> <option>Arbeit</option> <option>Ferien</option> <option>Krankheit</option> <option>Militär</option> </select> <div class="grid grid-cols-2 gap-4"> <input type="time" id="entry-start" class="p-4 bg-slate-50 border border-slate-100 rounded-xl"> <input type="time" id="entry-end" class="p-4 bg-slate-50 border border-slate-100 rounded-xl"> </div> <div class="flex gap-4 mt-8"> <button onclick="closeModal('time-modal')" class="flex-1 py-4 font-bold text-slate-400">Abbrechen</button> <button onclick="saveTime()" class="flex-1 bg-blue-600 text-white font-bold py-4 rounded-2xl shadow-lg shadow-blue-100">Speichern</button> </div> </div> </div> </div> <!-- Mitarbeiter Modal --> <div id="emp-modal" class="modal"> <div class="bg-white p-10 rounded-3xl w-full max-w-lg shadow-2xl"> <h3 class="text-2xl font-bold mb-6">Neuer Mitarbeiter</h3> <div class="space-y-4"> <input type="text" id="emp-name" placeholder="Name Vorname" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-xl"> <input type="text" id="emp-role" placeholder="Rolle (Freitext)" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-xl"> <input type="number" id="emp-pensum" placeholder="Pensum %" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-xl"> <div class="flex gap-4 mt-8"> <button onclick="closeModal('emp-modal')" class="flex-1 py-4 font-bold text-slate-400">Abbrechen</button> <button onclick="saveEmployee()" class="flex-1 bg-blue-600 text-white font-bold py-4 rounded-2xl">Mitarbeiter anlegen</button> </div> </div> </div> </div> </body> </html> ```
